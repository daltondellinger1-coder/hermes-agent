name: Hermes host supervisor

on:
  push:
    paths:
      - "ops/hermes-host-supervisor/**"
      - ".github/workflows/hermes-host-supervisor.yml"
  pull_request:
    paths:
      - "ops/hermes-host-supervisor/**"
      - ".github/workflows/hermes-host-supervisor.yml"

jobs:
  health-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run portable health contract
        shell: pwsh
        run: ./ops/hermes-host-supervisor/Test-HermesHealthContract.ps1
